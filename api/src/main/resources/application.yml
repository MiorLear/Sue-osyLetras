spring:
  application:
    name: explorarte-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/explorarte}
    username: ${SPRING_DATASOURCE_USERNAME:explorarte}
    password: ${SPRING_DATASOURCE_PASSWORD:explorarte_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  # Cloud Run injects PORT and requires the container to listen on it; local
  # dev / docker-compose don't set PORT, so this still defaults to 8000.
  port: ${PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # NO default on purpose (SEC-03): an unset JWT_SECRET must abort startup, not
    # fall back to a literal that is published in this repository. JwtService
    # rejects an empty, well-known, or <32-byte key. Generate one with
    # `openssl rand -base64 48`.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:19006}
  seed:
    default-password: ${SEED_USER_PASSWORD:explorarte123}
  supabase:
    url: ${SUPABASE_URL:}
    # Either the service_role key (recommended, bypasses RLS) or the anon key
    # (needs a storage RLS policy allowing uploads). See render.yaml.
    key: ${SUPABASE_KEY:}
  resend:
    # Resend API key (send-only). Empty -> email disabled (codes only logged).
    api-key: ${RESEND_API_KEY:}
    # Must be an address on a domain verified in Resend to reach arbitrary
    # recipients. Without a verified domain, onboarding@resend.dev only delivers
    # to your own Resend account email.
    from: ${RESEND_FROM:Sueños y Letras <onboarding@resend.dev>}
  auth:
    # SEC-05: a verification code is destroyed after this many failed guesses, so the
    # 6-digit space cannot be walked inside the 15-minute TTL. Must stay <= 5.
    otp-max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
  rate-limit:
    # SEC-05: token-bucket throttling on /auth/**. Two budgets — per client IP (applied by
    # AuthRateLimitFilter) and per account identifier (applied by AuthController).
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    ip-capacity: ${AUTH_RATE_LIMIT_IP_CAPACITY:30}
    ip-window-seconds: ${AUTH_RATE_LIMIT_IP_WINDOW_SECONDS:300}
    identifier-capacity: ${AUTH_RATE_LIMIT_IDENTIFIER_CAPACITY:10}
    identifier-window-seconds: ${AUTH_RATE_LIMIT_IDENTIFIER_WINDOW_SECONDS:300}
    # Upper bound on tracked IPs/identifiers, so the limiter itself can't be a memory DoS.
    max-tracked-keys: ${AUTH_RATE_LIMIT_MAX_TRACKED_KEYS:50000}
  # SEC-04: there is no AUTH_DEV_OTP_CODE any more. The fixed code was compared
  # before any DB lookup and was never bound to the identifier, so it worked as a
  # master key for /auth/otp/verify AND /auth/reset-password. No env var can
  # re-enable it. For local testing, read the code from the verification_codes
  # table (see VerificationCodeService's javadoc).
