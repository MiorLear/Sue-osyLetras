name: Deploy Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  hosting:
    name: Firebase Hosting (producción)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Instalar dependencias
        run: |
          npm ci
          npm --prefix web ci
      - name: Compilar shared y la PWA
        run: |
          npm --prefix shared run build
          npm --prefix web run build
      - name: Autenticar en Google Cloud sin llave JSON
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Publicar Hosting
        working-directory: web
        run: npx -y firebase-tools@latest deploy --only hosting --project explorarte-6335b --non-interactive
