name: CI

# Puertas automaticas para cada PR y para los pushes a las ramas integradoras.
# Antes de esto el unico check era el build de Render, que ademas se saltaba
# los tests del API (MAINT-02).
#
# NOTA: para que un check en rojo bloquee de verdad el merge hay que marcar
# "js", "api" y "e2e" como required status checks en Settings > Branches > main.
# Eso es configuracion del repositorio y no se puede versionar aqui.

on:
  push:
    branches: [main, DEVELOP]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Navegador real (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # `web` consume el paquete compilado de `shared`. Instalar solo dentro de
      # web funciona en una máquina de desarrollo con node_modules viejo, pero
      # deja a shared sin su propio TypeScript en un runner limpio.
      - name: Install (raiz y shared)
        run: npm ci

      - name: Install (web)
        working-directory: web
        run: npm ci

      - name: Build shared
        run: npm --prefix shared run build

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Typecheck E2E
        working-directory: web
        run: npm run typecheck:e2e

      # Los binarios pesan mucho y sí se pueden reutilizar. Las bibliotecas del
      # sistema vienen de apt y hay que comprobarlas en cada runner nuevo.
      - name: Cache navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Instalar Chromium y WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium webkit

      - name: Instalar dependencias del sistema
        working-directory: web
        run: npx playwright install-deps chromium webkit

      - name: E2E
        working-directory: web
        run: npm run e2e

      - name: Guardar informe y trazas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  js:
    name: JS/TS (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 es el que pinea Render (render.yaml: NODE_VERSION); 24 es el que
        # usa el equipo en local. Los dos tienen que pasar.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            web/node_modules
          key: node-modules-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json', 'web/package-lock.json') }}

      - name: Install (raiz)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install (web)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      # shared/dist no viaja en la cache de node_modules y lo consumen los tres
      # proyectos, asi que se compila siempre.
      - name: Build shared
        run: npm --prefix shared run build

      - name: Typecheck (movil)
        run: npm run typecheck

      - name: Lint (movil)
        run: npm run lint

      - name: Lint (shared)
        run: npm --prefix shared run lint

      - name: Lint (web)
        working-directory: web
        run: npm run lint

      - name: Test (movil · src/lib offline)
        run: npm test

      - name: Test (shared)
        run: npm --prefix shared run test

      - name: Test (web)
        working-directory: web
        run: npm test

      - name: Build (web)
        working-directory: web
        run: npm run build

  api:
    name: API (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('api/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # api/mvnw esta commiteado con modo 100644 (se creo desde Windows), asi
      # que en Ubuntu no es ejecutable. Se arregla aqui en vez de cambiarle el
      # modo al fichero para no tocar api/ desde este PR.
      - name: Hacer ejecutable el wrapper de Maven
        run: chmod +x api/mvnw

      - name: Test
        working-directory: api
        run: ./mvnw -B test

      - name: Package
        working-directory: api
        run: ./mvnw -B -DskipTests package
