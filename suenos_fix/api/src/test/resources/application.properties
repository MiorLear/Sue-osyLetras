# Test-scope defaults.
#
# app.jwt.secret has NO default in application.yml on purpose (SEC-03): the API
# must refuse to start without a real JWT_SECRET. Any @SpringBootTest therefore
# needs a key supplied here, otherwise the context fails to load.
app.jwt.secret=test-only-signing-key-0123456789-abcdefghij

# The user seeder is opt-in (SEC-02) and stays off in tests.
app.seed.default-password=
